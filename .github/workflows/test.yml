name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with the base image in Dockerfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # Fails if pinned versions conflict (e.g. a lone Dependabot bump)
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports
        run: python -c "import azmonitor, azclient, resilient_runner, logger_config"

      - name: Run tests
        run: python -m unittest -v test_azclient
